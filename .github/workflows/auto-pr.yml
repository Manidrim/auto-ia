name: PR automatique depuis issue validée

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: auto-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event.label.name == 'validated'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Générer la PR avec l'IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/generate-pr.mjs
