name: Répondre à une question sur la PR (/question)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: answer-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/question')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Répondre avec l'IA (sans dev)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/answer-pr.mjs
