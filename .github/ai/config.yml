project:
  stack: "Vite+React"
  language: "fr"
  audience: "élèves de primaire"
  test_framework: "vitest"
  
file_filters:
  extensions: [".jsx", ".js", ".css", ".html", ".json"]
  exclude: [".github/scripts"]
  max_file_size: 8000

labels:
  validated: "validated"
  enhancement: "enhancement"
  question: "question"
  fix: "fix"

branch:
  prefix: "auto/pr-issue"
  bot_name: "auto-ia-bot"
  bot_email: "actions@github.com"

commands:
  question: "/question"
  fix: "/corrige"

issue_format: "user_story"

commit_messages:
  feat: "feat:"
  fix: "fix:"

pr_body_template: "Générée automatiquement par l'IA à partir de l'issue #{{issue_number}}."
